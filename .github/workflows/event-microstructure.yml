name: Event-level Base V3 spread diagnostics (no wallet)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/event-microstructure.yml'
      - 'scripts/event_microstructure.py'
      - 'scripts/volume_blocks.py'
      - 'tests/test_event_microstructure.py'
permissions:
  contents: read
concurrency:
  group: event-microstructure-research
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests, including price conversion and whole-transaction boundaries
        run: python -m unittest discover -s tests -v
      - name: Identify high-volume historical swap blocks
        shell: bash
        run: |
          mkdir -p validation/microstructure
          timeout 75s python -m scripts.volume_blocks \
            --out validation/microstructure \
            --span 32000 --segments 9 --width 35 \
            --top-n 3 --min-swap 1000 \
            | tee validation/microstructure/event-select.log \
            || echo 'EVENT_SELECTION_PARTIAL_OR_UNAVAILABLE' | tee -a validation/microstructure/event-select.log
      - name: Apply real Swap logs after complete transaction boundaries
        shell: bash
        run: |
          timeout 185s python -m scripts.event_microstructure \
            --events validation/microstructure/event-selection.json \
            --out validation/microstructure \
            --max-blocks 3 --loan-usdc 1000 --timeout 10 \
            | tee validation/microstructure/console.log \
            || echo 'MICROSTRUCTURE_INCOMPLETE' | tee -a validation/microstructure/console.log
      - name: Safety-proof classification
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path("validation/microstructure")
          r=json.loads((p/"microstructure-report.json").read_text()) if (p/"microstructure-report.json").exists() else {}
          summary={
              "analyzed_blocks":r.get("blocks_analyzed",0),
              "swap_logs":r.get("swap_logs",0),
              "after_full_transaction_boundaries":r.get("transaction_boundaries",0),
              "positive_spot_screening_signals":r.get("positive_spot_boundaries",0),
              "fork_executed_profit_candidates":0,
              "classification":"SPOT_EVENT_SCREENING_NOT_TRADE_EXECUTABLE",
              "warnings":"Event sqrt prices do not reproduce complete intervening EVM storage, route liquidity and execution order."
          }
          p.mkdir(parents=True,exist_ok=True)
          (p/"verification-summary.json").write_text(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Event-level V3 spot screening (not execution PnL)\n\n")
              for k,v in summary.items(): f.write(f"- {k}: {v}\n")
          print(json.dumps(summary,indent=2))
          if summary["analyzed_blocks"] == 0:
              raise SystemExit("No historical block was successfully analyzed; cannot count this as a valid sample")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-event-microstructure-evidence
          path: validation/microstructure/
          retention-days: 21
          if-no-files-found: warn
