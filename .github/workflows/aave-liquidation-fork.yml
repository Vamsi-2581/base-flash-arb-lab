name: Historical Aave Base liquidation flash-loan fork proof (no broadcast)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aave-liquidation-fork.yml'
      - 'src/FlashLiquidator.sol'
      - 'test/FlashLiquidator.t.sol'
      - 'script/LiquidationForkProof.s.sol'
      - 'test/LiquidationForkProof.t.sol'
      - 'scripts/liquidation_replay_seeds.py'
      - 'tests/test_liquidation_replay_seeds.py'
      - 'research/liquidation_preflight.py'
      - 'tests/test_liquidation_preflight.py'
permissions:
  contents: read
jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Test stand-alone actual-loan liquidation contract and receipt decoder
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_liquidation_replay_seeds.py -v
          forge test --match-contract FlashLiquidatorTest -vv
      - name: Collect verified previously successful Aave liquidation transaction receipts
        shell: bash
        run: |
          mkdir -p validation/liquidation-fork
          timeout 65s python -m scripts.liquidation_replay_seeds \
            --out validation/liquidation-fork \
            | tee validation/liquidation-fork/seed-report.log \
            || echo 'HISTORICAL_TRANSACTION_RECEIPTS_UNAVAILABLE' \
                  | tee -a validation/liquidation-fork/seed-report.log
      - name: Check pre-liquidation archive state, Health Factor, and modeled margin
        shell: bash
        run: |
          if [[ -s validation/liquidation-fork/historical-liquidation-seeds.json ]]; then
            timeout 125s python -m research.liquidation_preflight \
              --input validation/liquidation-fork/historical-liquidation-seeds.json \
              --out validation/liquidation-fork \
              | tee validation/liquidation-fork/preflight-summary.log \
              || echo 'ARCHIVE_PRESTATE_PARTIAL_OR_UNAVAILABLE' | tee -a validation/liquidation-fork/preflight-summary.log
          fi
      - name: Attempt actual Aave loan, liquidationCall, DEX swap, and repayment in pinned Base fork
        shell: bash
        run: |
          shopt -s nullglob
          # Never add --broadcast; no wallet/private keys.
          urls=("https://mainnet.base.org" "https://base.drpc.org" "https://base-mainnet.g.alchemy.com/public")
          for candidate in validation/liquidation-fork/liquidation-candidate-*.json; do
            for url in "${urls[@]}"; do
              echo "Trying read-only Forge proof for historical seed at ${candidate} with provider"
              RUN_HISTORICAL_FORK=true LQ_CANDIDATE_PATH="${candidate}" BASE_RPC_URL="${url}" \
                timeout 32s forge test --match-contract LiquidationForkProofTest \
                --match-test testHistoricalRealProtocolLiquidation -vvvv \
                > /tmp/latest_liquidation_fork.log 2>&1 \
                && test -s validation/liquidation-fork/fork-profit-proof.json \
                && break 2
              cat /tmp/latest_liquidation_fork.log >> validation/liquidation-fork/fork-attempts.log
              echo "FORK_INCOMPLETE_OR_NOT_PROFITABLE candidate=${candidate} rpc=${url}" \
                 | tee -a validation/liquidation-fork/fork-attempts.log
              grep -Ei 'Error:|revert|failed to|http.*error|provider.*error|compilation' \
                /tmp/latest_liquidation_fork.log | tail -n 5 || true
            done
          done
          if test -s validation/liquidation-fork/fork-profit-proof.json; then
            echo "Verified local historical fork and conservative modeled positive USDC net."
            cat validation/liquidation-fork/fork-profit-proof.json
          else
            echo "NO_FORK_VERIFIED_AFTER_GAS_PROFIT on accessible providers."
            echo "--- Fork error diagnostics (tail, non-secret public RPC only) ---"
            tail -n 120 validation/liquidation-fork/fork-attempts.log || true
          fi
      - name: Fail-closed classification of outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("validation/liquidation-fork")
          root.mkdir(parents=True,exist_ok=True)
          seeds=root/"historical-liquidation-seeds.json"
          seed=json.loads(seeds.read_text()) if seeds.exists() else {}
          p=root/"fork-profit-proof.json"
          verified=False
          data={}
          if p.exists():
              try:
                  data=json.loads(p.read_text())
                  verified=(data.get("status")=="FORK_ESTIMATED_AFTER_GAS_POSITIVE"
                      and data.get("real_aave_loan_liquidation_swap_and_repayment") is True
                      and int(data.get("net_after_gas_usdc_units",0))>0
                      and int(data.get("usdc_profit_units",0))>int(data.get("modeled_gas_usdc_units",0))
                      and data.get("broadcast") is False)
              except (ValueError,TypeError):verified=False
          pre=root/"preflight.json"
          pre_data=json.loads(pre.read_text()) if pre.exists() else {}
          summary={
            "historical_valid_liquidation_receipt_seeds":seed.get("valid_usdc_debt_weth_collateral_receipts",0),
            "archive_historical_health_reads":pre_data.get("historical_user_health_reads",0),
            "archive_positive_quote_surplus_before_gas":pre_data.get("positive_quoted_surplus_before_gas",0),
            "full_real_aave_loan_liquidation_swap_repay_positive_after_conservative_gas":int(verified),
            "profit_usdc_units":data.get("usdc_profit_units") if verified else None,
            "net_after_gas_usdc_units":data.get("net_after_gas_usdc_units") if verified else None,
            "classification":"FORK_ESTIMATED_AFTER_GAS_POSITIVE" if verified else "NO_EXECUTION_VERIFIED_PROFIT",
            "caveat":"Fork B-1, not exact intra-block preceding transaction state; model Gas, not transaction receipts.",
            "real_money_spent":False,
            "transaction_broadcast":False,
          }
          (root/"classification.json").write_text(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Historical Aave Base full flash-loan fork attempt\n\n")
              for key,val in summary.items(): f.write(f"- **{key}**: {val}\n")
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aave-full-liquidation-fork-attempt-evidence
          path: validation/liquidation-fork/
          retention-days: 30
          if-no-files-found: warn
