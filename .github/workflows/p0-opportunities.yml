name: P0 liquidation + UniswapX read-only research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p0-opportunities.yml'
      - 'research/aave_liquidation_survey.py'
      - 'research/uniswapx_orders_readonly.py'
      - 'tests/test_new_p0_research.py'
      - 'research/aave_receipt_quote_screen.py'
      - 'tests/test_aave_receipt_screen.py'
      - 'scripts/liquidation_replay_seeds.py'
      - 'research/liquidation_preflight.py'
      - 'src/FlashLiquidator.sol'
      - 'test/LiquidationForkProof.t.sol'
permissions:
  contents: read
concurrency:
  group: p0-readonly-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan real Aave V3 liquidation history on Base
        shell: bash
        run: |
          mkdir -p validation/p0/liquidations
          set -o pipefail
          timeout 235s python -m research.aave_liquidation_survey \
            --out validation/p0/liquidations --span 6000 --chunk 256 \
            --max-logs 60 --rpc-timeout 7 \
            | tee validation/p0/liquidations/stdout.log \
            || echo "AAVE_COVERAGE_INCOMPLETE" | tee -a validation/p0/liquidations/stdout.log
      - name: Counterfactual post-block liquidation receipt pricing (not executable)
        shell: bash
        run: |
          if [[ -s validation/p0/liquidations/liquidation-survey.json ]]; then
            timeout 125s python -m research.aave_receipt_quote_screen \
              --input validation/p0/liquidations/liquidation-survey.json \
              --out validation/p0/valuation --limit 8 \
              | tee validation/p0/liquidations/valuation-console.log \
              || echo 'RECEIPT_QUOTES_UNAVAILABLE' | tee -a validation/p0/liquidations/valuation-console.log
          else
            echo 'NO_AAVE_SURVEY_JSON' | tee validation/p0/liquidations/valuation-console.log
          fi
      - name: Promote any REAL recently observed Aave USDC/WETH liquidations into replay seeds
        id: candidatecheck
        shell: bash
        run: |
          mkdir -p validation/liquidation-fork
          python -m scripts.liquidation_replay_seeds \
            --survey validation/p0/liquidations/liquidation-survey.json \
            --recent-only --out validation/liquidation-fork \
            | tee validation/liquidation-fork/seed-console.log || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path("validation/liquidation-fork/historical-liquidation-seeds.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          print("has_candidate="+str(bool(data.get("seeds"))).lower())
          PY
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.candidatecheck.outputs.has_candidate == 'true'
        with:
          version: stable
      - name: Only when real liquidation events exist, attempt loan + liquidation + swap + repayment fork
        if: steps.candidatecheck.outputs.has_candidate == 'true'
        shell: bash
        run: |
          timeout 90s python -m research.liquidation_preflight \
            --input validation/liquidation-fork/historical-liquidation-seeds.json \
            --out validation/liquidation-fork || true
          shopt -s nullglob
          for candidate in validation/liquidation-fork/liquidation-candidate-*.json; do
            for url in "https://mainnet.base.org" "https://base.drpc.org"; do
              RUN_HISTORICAL_FORK=true LQ_CANDIDATE_PATH="$candidate" BASE_RPC_URL="$url" \
                timeout 38s forge test --match-contract LiquidationForkProofTest \
                  --match-test testHistoricalRealProtocolLiquidation -vv \
                  > /tmp/latest_p0_liq_fork.log 2>&1 \
                && test -s validation/liquidation-fork/fork-profit-proof.json \
                && break 2
              echo "FORK_UNVERIFIED candidate=$candidate rpc=$url" | tee -a validation/liquidation-fork/fork-attempts.log
              grep -Ei 'Error:|revert|failed to' /tmp/latest_p0_liq_fork.log \
                | tail -n 4 | tee -a validation/liquidation-fork/fork-attempts.log || true
            done
          done
      - name: Discover UniswapX Base Dutch V3 signed order envelopes (no fills)
        shell: bash
        run: |
          mkdir -p validation/p0/uniswapx
          set -o pipefail
          timeout 35s python -m research.uniswapx_orders_readonly \
            --out validation/p0/uniswapx --limit 20 --timeout 12 \
            | tee validation/p0/uniswapx/stdout.log \
            || echo "UNISWAPX_COVERAGE_UNAVAILABLE" | tee -a validation/p0/uniswapx/stdout.log
      - name: Report observed results and explicit absence of profit proof
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("validation/p0")
          a=p/"liquidations/liquidation-survey.json"
          b=p/"uniswapx/orders-observation.json"
          liquid=json.loads(a.read_text()) if a.exists() else {}
          orders=json.loads(b.read_text()) if b.exists() else {}
          valuation_path=p/"valuation/receipt-quote-screen.json"
          valuation=json.loads(valuation_path.read_text()) if valuation_path.exists() else {}
          proof_path=Path("validation/liquidation-fork/fork-profit-proof.json")
          proof=json.loads(proof_path.read_text()) if proof_path.exists() else {}
          verified=(proof.get("status")=="FORK_ESTIMATED_AFTER_GAS_POSITIVE"
             and proof.get("real_aave_loan_liquidation_swap_and_repayment") is True
             and int(proof.get("net_after_gas_usdc_units",0))>0)
          result={
            "aave_status":liquid.get("status","NOT_EXECUTED"),
            "recent_real_liquidation_fork_verified_after_gas":int(verified),
            "recent_real_liquidation_fork_profit_usdc_units":proof.get("net_after_gas_usdc_units") if verified else None,
            "aave_event_logs_observed":liquid.get("events_found",0),
            "aave_range_windows_successful":liquid.get("range_windows_successful",0),
            "aave_range_windows_failed":liquid.get("range_windows_failed",0),
            "aave_blocks_actually_covered":liquid.get("exact_blocks_covered",0),
            "aave_requested_span_blocks":liquid.get("requested_span_blocks",0),
            "aave_complete_period_scan":liquid.get("is_complete_period_coverage",False),
            "aave_coverage_class":"FULL" if liquid.get("is_complete_period_coverage") else (
                "PARTIAL" if liquid.get("exact_blocks_covered",0)>0 else "UNAVAILABLE"),
            "historical_receipts_quote_screened":valuation.get("receipt_quotes_complete",0),
            "hypothetical_post_block_surplus_count":valuation.get("positive_post_block_counterfactuals",0),
            "uniswapx_status":orders.get("status","NOT_EXECUTED"),
            "uniswapx_open_envelopes_seen":orders.get("orders_returned"),
            "uniswapx_signature_and_reactor_verified":False,
            "counterfactual_aave_full_flash_loan_fork_verified":int(verified),
            "uniswapx_filler_simulation_verified":0,
            "executable_profit_found":bool(verified),
            "gas_usd_spent_on_chain":0,
            "note":"Historical liquidations already captured by somebody else, and order envelopes are not executable opportunities. No wallet keys, trades or deployments."
          }
          p.mkdir(exist_ok=True,parents=True)
          (p/"verification-summary.json").write_text(json.dumps(result,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
            out.write("## P0 real Base research (not execution profit)\n\n")
            for key,val in result.items(): out.write(f"- **{key}**: {val}\n")
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-aave-uniswapx-readonly-evidence
          path: |
            validation/p0/
            validation/liquidation-fork/
          if-no-files-found: warn
          retention-days: 30
