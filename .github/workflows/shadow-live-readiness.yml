name: Base Aave shadow-live readiness (strictly no transactions)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shadow-live-readiness.yml'
      - 'research/live_liquidation_gate.py'
      - 'tests/test_live_liquidation_gate.py'
      - 'research/live_shadow_candidates.py'
      - 'tests/test_live_shadow_candidates.py'
      - 'test/LiveShadowFork.t.sol'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run shadow risk policy tests
        run: python -m unittest discover -s tests -p test_live_liquidation_gate.py -v
      - name: Sample recent real Aave borrower addresses without trading
        shell: bash
        run: |
          mkdir -p validation/shadow-live/sources
          timeout 100s python -m research.aave_borrower_health \
            --out validation/shadow-live/sources --span 1536 --max-users 25 \
            | tee validation/shadow-live/borrower-sample.log \
            || echo "BORROWER_SAMPLING_INCOMPLETE" | tee -a validation/shadow-live/borrower-sample.log
      - name: Independently inspect Base chain/pool/reserve safety at one current block
        shell: bash
        run: |
          mkdir -p validation/shadow-live
          python -m research.live_liquidation_gate \
            --source validation/shadow-live/sources/borrower-health-snapshot.json \
            --out validation/shadow-live \
            | tee validation/shadow-live/console.log \
            || echo "MAINNET_READINESS_UNAVAILABLE" | tee -a validation/shadow-live/console.log
      - name: Generate strict current-state shadow-fork seeds
        id: shadow
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_live_shadow_candidates.py -v
          python -m research.live_shadow_candidates \
            --input validation/shadow-live/readiness.json \
            --out validation/shadow-live/candidates
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path("validation/shadow-live/candidates/summary.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          print("has_candidates="+str(d.get("candidate_count",0)>0).lower())
          PY
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.shadow.outputs.has_candidates == 'true'
        with:
          version: stable
      - name: Attempt local mainnet-block Aave loan, liquidation, swap and repayment only on verified candidates
        if: steps.shadow.outputs.has_candidates == 'true'
        shell: bash
        run: |
          for candidate in validation/shadow-live/candidates/shadow-*.json; do
            rm -f validation/shadow-live/atomic-simulation.json
            RUN_SHADOW_LIVE_FORK=true \
              SHADOW_CANDIDATE_PATH="$candidate" \
              BASE_RPC_URL=https://mainnet.base.org \
              timeout 65s forge test --match-contract LiveShadowForkTest \
                --match-test testCurrentReadOnlyForkLiquidation -vvv \
              > validation/shadow-live/local-fork-console.log 2>&1 || true
            if test -s validation/shadow-live/atomic-simulation.json; then
              cp validation/shadow-live/atomic-simulation.json \
                validation/shadow-live/current-state-token-profit.json
              echo "LOCAL_ATOMIC_FORK_ONLY_REQUIRES_L1_FEE_AND_INCLUSION_CHECKS"
              break
            fi
            grep -Ei 'Error:|Revert|FAIL' validation/shadow-live/local-fork-console.log | tail -n 6 || true
          done
      - name: Publish fail-closed status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("validation/shadow-live/readiness.json")
          r=json.loads(p.read_text()) if p.exists() else {}
          simulated=Path("validation/shadow-live/current-state-token-profit.json")
          atomic=json.loads(simulated.read_text()) if simulated.exists() else {}
          summary={
            "status":r.get("status","NO_VALID_REPORT"),
            "local_atomic_simulation_possible":atomic.get("status")=="FULL_ATOMIC_CURRENT_BLOCK_FORK_TOKEN_PROFIT_ONLY",
            "local_atomic_token_profit_usdc_units":atomic.get("profit_usdc_units_after_flash_repayment"),
            "mainnet_aave_flash_premium_bps":r.get("flash_premium_bps"),
            "aave_pool":r.get("aave_pool"),
            "chain_id":r.get("chain_id"),
            "revalidated_recent_borrowers":r.get("account_reads_complete",0),
            "account_level_hf_below_one":r.get("account_level_underwater",0),
            "verified_current_token_specific_borrowers":r.get("asset_specific_pair_verified",0),
            "underwater_and_USDC_WETH_pair_verified":r.get("underwater_and_USDC_WETH_pair_verified",0),
            "actual_atomic_simulations":1 if atomic.get("status")=="FULL_ATOMIC_CURRENT_BLOCK_FORK_TOKEN_PROFIT_ONLY" else 0,
            "transactions_signed":0,
            "transactions_broadcast":0,
            "live_ready":False,
            "unresolved_blockers":"Executor not deployed/audited; no verified per-reserve debt and collateral liquidationCall, no full same-block eth_call, no calibrated Base L1 transaction fee or competitive inclusion model."
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Base Aave shadow-live readiness\n\n")
            for k,v in summary.items():f.write(f"- **{k}**: {v}\n")
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-aave-shadow-live-readiness
          path: validation/shadow-live/
          if-no-files-found: warn
          retention-days: 14
