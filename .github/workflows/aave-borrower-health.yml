name: Aave Base recent-borrower health research (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aave-borrower-health.yml'
      - 'research/aave_borrower_health.py'
      - 'tests/test_aave_borrower_health.py'
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ABI and HF threshold tests
        run: python -m unittest discover -s tests -p 'test_aave_borrower_health.py' -v
      - name: Research recent borrowers and read latest health factors
        shell: bash
        run: |
          mkdir -p validation/p0/health
          timeout 145s python -m research.aave_borrower_health \
            --out validation/p0/health --span 4096 --max-users 40 \
            | tee validation/p0/health/stdout.log \
            || echo "BORROWER_HEALTH_SAMPLE_UNAVAILABLE" | tee -a validation/p0/health/stdout.log
      - name: Report sampled coverage and safe classification
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path("validation/p0/health/borrower-health-snapshot.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          lines=["## Aave Base recent borrower risk screen","",
            "- State: "+str(d.get("status","NO_RESULT")),
            "- Actual recent Borrow event block coverage: "+str(d.get("borrow_log_blocks_covered",0)),
            "- Sampled borrower addresses: "+str(d.get("recent_borrower_addresses_sampled",0)),
            "- Accounts actually read: "+str(d.get("accounts_read_successfully",0)),
            "- Sampled health factor below 1.05: "+str(d.get("borrowers_near_hf_1_05",0)),
            "- Sampled health factor below 1: "+str(d.get("borrowers_hf_below_one",0)),
            "- **Actual profitable liquidation flash-loan forks: 0**",
            "", "Borrow-event-derived addresses are NOT the full protocol population. Health factor alone does not establish liquidatability or net profit."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
            out.write("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-aave-health-sample
          path: validation/p0/health/
          retention-days: 14
          if-no-files-found: warn
