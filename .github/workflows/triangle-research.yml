name: Base V3 triangular quote research (no wallet)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/triangle-research.yml'
      - 'scripts/triangle_backtest.py'
      - 'tests/test_triangle_backtest.py'
permissions:
  contents: read
jobs:
  triangle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm offline test suite
        run: python -m unittest discover -s tests -v
      - name: Read-only pinned-block triangle strategy
        shell: bash
        run: |
          mkdir -p validation/triangle
          timeout 260s python -m scripts.triangle_backtest \
            --out validation/triangle \
            --pairs 'WETH,cbETH;DAI,USDbC' \
            --lookbacks 128,4096 \
            --amounts 200,1000,5000 \
            --venue-limit 3 --max-seconds 220 \
            | tee validation/triangle/console.log || echo 'TRIANGLE_SAMPLING_INCOMPLETE' | tee -a validation/triangle/console.log
      - name: Evidence report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path("validation/triangle")
          path=p/"triangle-report.json"
          r=json.loads(path.read_text()) if path.is_file() else {}
          summary={
            "strategy_samples_completed":r.get("strategies_quoted",0),
            "three_hop_quote_paths_completed":r.get("quoted_paths",0),
            "positive_modeled_three_hop_paths":r.get("positive_model_routes",0),
            "best_modeled_after_gas_usdc_units":(r.get("best") or {}).get("modeled_net_usdc_units"),
            "full_execution_fork_verified":0,
            "classification":"NOT_EXECUTABLE_WITH_CURRENT_FLASHARB",
            "no_trading_keys_or_broadcasts":True}
          p.mkdir(parents=True,exist_ok=True)
          (p/"verification-summary.json").write_text(json.dumps(summary,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Three-hop Base V3 quote research — not executable PnL\n")
              for k,v in summary.items():f.write(f"- {k}: {v}\n")
          print(json.dumps(summary,indent=2))
          if not summary["strategy_samples_completed"]:
              raise SystemExit("No complete strategy quoted; CI must not label this an empirical test")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triangle-quote-research-evidence
          path: validation/triangle/
          retention-days: 21
          if-no-files-found: warn
